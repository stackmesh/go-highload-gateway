syntax = "proto3";

package gateway.v1;

option go_package = "github.com/stackmesh/go-highload-gateway/api/gen/gateway/v1;gatewayv1";

// Gateway is the programmatic ingress. It runs the same admission and
// upstream path as the HTTP edge. HTTP streams the upstream body; Proxy
// returns a complete protobuf message, so the body is capped by the
// configured limit.
service Gateway {
  rpc Proxy(ProxyRequest) returns (ProxyResponse);
}

message ProxyRequest {
  string method = 1;
  string path = 2;
  map<string, string> headers = 3;
  bytes body = 4;
  string api_key = 5;
}

message ProxyResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
  int64 latency_us = 4;
}
