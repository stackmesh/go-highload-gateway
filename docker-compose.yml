services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  upstream:
    build: .
    entrypoint: ["/upstream"]
    environment:
      UPSTREAM_ADDR: ":8081"
    expose:
      - "8081"

  gateway:
    build: .
    entrypoint: ["/gateway"]
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      PPROF_ADDR: ":6060"
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_STREAM: gateway.requests
      UPSTREAM_URL: http://upstream:8081
      LOG_LEVEL: info
    ports:
      - "8080:8080"
      - "9090:9090"
      - "6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      upstream:
        condition: service_started

  worker:
    build: .
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_STREAM: gateway.requests
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  loadgen:
    profiles: ["load"]
    build: .
    entrypoint: ["/loadgen"]
    command:
      - -url
      - http://gateway:8080/v1/echo
      - -key
      - gw_live_demo
      - -c
      - "128"
      - -d
      - 15s
    depends_on:
      gateway:
        condition: service_started

volumes:
  pgdata:
